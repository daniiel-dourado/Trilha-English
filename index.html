/* ============ STATE ============ */

let currentLessonIndex = 0;
let completedLessons = new Set();
let quizState = {};

const pathList = document.getElementById('path-list');
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebar-overlay');
const mobileToggle = document.getElementById('mobile-toggle');
const overallFill = document.getElementById('overall-fill');
const overallLabel = document.getElementById('overall-label');
const lessonEyebrow = document.getElementById('lesson-eyebrow');
const lessonTitle = document.getElementById('lesson-title');
const videoFrame = document.getElementById('video-frame');
const markDoneBtn = document.getElementById('mark-done-btn');
const summaryText = document.getElementById('summary-text');
const ipaGrid = document.getElementById('ipa-grid');
const quizCard = document.getElementById('quiz-card');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

function renderPath() {
  pathList.innerHTML = '';
  lessons.forEach((lesson, i) => {
    const li = document.createElement('li');
    li.className = 'path-item' + (i === currentLessonIndex ? ' active' : '') + (completedLessons.has(i) ? ' done' : '');
    li.innerHTML = `
      <div class="path-marker">${completedLessons.has(i) ? '✓' : i + 1}</div>
      <div class="path-text">
        <div class="path-title">${lesson.title}</div>
        <div class="path-tag">${lesson.tag}</div>
      </div>
    `;
    li.addEventListener('click', () => {
      currentLessonIndex = i;
      loadLesson();
      if (window.innerWidth <= 860) closeSidebar();
    });
    pathList.appendChild(li);
  });
  const doneCount = completedLessons.size;
  const pct = (doneCount / lessons.length) * 100;
  overallFill.style.width = `${pct}%`;
  overallLabel.textContent = `${doneCount} de ${lessons.length} aulas concluídas`;
}

function speak(text, rate) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = rate || 0.85;
  window.speechSynthesis.speak(utter);
}

function renderIPA(lesson) {
  ipaGrid.innerHTML = '';
  lesson.ipa.forEach(item => {
    const chip = document.createElement('div');
    chip.className = 'ipa-chip';
    chip.innerHTML = `
      <span class="ipa-symbol">/${item.ipa}/</span>
      <span class="ipa-word">${item.word}</span>
      <span class="ipa-play">🔊</span>
    `;
    chip.addEventListener('click', () => {
      chip.classList.add('playing');
      speak(item.word.replace(/\s*\(.*?\)\s*/g, ''), 0.8);
      setTimeout(() => chip.classList.remove('playing'), 700);
    });
    ipaGrid.appendChild(chip);
  });
}

function renderQuiz(lessonIndex) {
  const lesson = lessons[lessonIndex];
  if (!quizState[lessonIndex]) {
    quizState[lessonIndex] = { current: 0, answered: {}, score: 0 };
  }
  const state = quizState[lessonIndex];
  const qIndex = state.current;
  const question = lesson.quiz[qIndex];
  const alreadyAnswered = state.answered[qIndex] !== undefined;

  let html = `<div class="quiz-progress">Pergunta ${qIndex + 1} de ${lesson.quiz.length}</div>`;
  html += `<div class="quiz-question">${question.q}</div>`;

  if (question.type === 'mc') {
    html += `<div class="quiz-options" id="quiz-options-wrap">`;
    question.options.forEach((opt, i) => {
      let cls = 'quiz-option';
      if (alreadyAnswered) {
        if (i === question.correct) cls += ' correct';
        else if (i === state.answered[qIndex] && i !== question.correct) cls += ' incorrect';
      }
      html += `<button class="${cls}" data-i="${i}" ${alreadyAnswered ? 'disabled' : ''}>${opt}</button>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="quiz-input-row">
      <input type="text" id="quiz-type-input" placeholder="digite sua resposta…" autocomplete="off" ${alreadyAnswered ? 'disabled' : ''} value="${alreadyAnswered ? question.answer : ''}"/>
      <button class="quiz-submit" id="quiz-type-submit" ${alreadyAnswered ? 'disabled' : ''}>Verificar</button>
    </div>`;
  }

  html += `<div class="quiz-feedback ${alreadyAnswered ? 'show ' + (isAnswerCorrect(question, state.answered[qIndex]) ? 'correct' : 'incorrect') : ''}" id="quiz-feedback">`;
  if (alreadyAnswered) {
    html += isAnswerCorrect(question, state.answered[qIndex])
      ? `<b>Certo!</b> ${question.explain}`
      : `<b>Quase.</b> ${question.explain}`;
  }
  html += `</div>`;

  html += `<div class="quiz-nav">
    <button class="quiz-nav-btn" id="quiz-prev" ${qIndex === 0 ? 'disabled' : ''}>← Anterior</button>
    <span class="quiz-score">Pontuação: <b>${state.score}</b> / ${lesson.quiz.length}</span>
    <button class="quiz-nav-btn" id="quiz-next" ${qIndex === lesson.quiz.length - 1 ? 'disabled' : ''}>Próxima →</button>
  </div>`;

  quizCard.innerHTML = html;

  if (question.type === 'mc') {
    document.querySelectorAll('#quiz-options-wrap .quiz-option').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.i);
        answerQuiz(lessonIndex, qIndex, i);
      });
    });
  } else {
    const input = document.getElementById('quiz-type-input');
    const submit = document.getElementById('quiz-type-submit');
    const submitFn = () => {
      const val = input.value.trim().toLowerCase();
      if (!val) return;
      answerQuiz(lessonIndex, qIndex, val);
    };
    submit.addEventListener('click', submitFn);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitFn(); });
    if (!alreadyAnswered) input.focus();
  }

  document.getElementById('quiz-prev').addEventListener('click', () => {
    state.current = Math.max(0, qIndex - 1);
    renderQuiz(lessonIndex);
  });
  document.getElementById('quiz-next').addEventListener('click', () => {
    state.current = Math.min(lesson.quiz.length - 1, qIndex + 1);
    renderQuiz(lessonIndex);
  });
}

function isAnswerCorrect(question, given) {
  if (question.type === 'mc') return given === question.correct;
  return given === question.answer.toLowerCase();
}

function answerQuiz(lessonIndex, qIndex, given) {
  const lesson = lessons[lessonIndex];
  const question = lesson.quiz[qIndex];
  const state = quizState[lessonIndex];
  if (state.answered[qIndex] !== undefined) return;

  state.answered[qIndex] = given;
  const correct = isAnswerCorrect(question, given);
  if (correct) state.score += 1;

  if (question.type === 'type' && correct) {
    speak(question.answer, 0.85);
  }

  renderQuiz(lessonIndex);
}

function loadLesson() {
  const lesson = lessons[currentLessonIndex];
  lessonEyebrow.textContent = `Aula ${currentLessonIndex + 1} de ${lessons.length} · ${lesson.tag}`;
  lessonTitle.textContent = lesson.title;
  videoFrame.src = `https://www.youtube.com/embed/${lesson.id}`;
  summaryText.innerHTML = lesson.summary.map(p => `<p>${p}</p>`).join('');
  renderIPA(lesson);
  renderQuiz(currentLessonIndex);
  markDoneBtn.classList.toggle('done', completedLessons.has(currentLessonIndex));
  markDoneBtn.textContent = completedLessons.has(currentLessonIndex) ? '✓ Aula concluída' : 'Marcar aula como concluída';
  prevBtn.disabled = currentLessonIndex === 0;
  nextBtn.disabled = currentLessonIndex === lessons.length - 1;
  renderPath();
  window.scrollTo(0, 0);
}

markDoneBtn.addEventListener('click', () => {
  if (completedLessons.has(currentLessonIndex)) {
    completedLessons.delete(currentLessonIndex);
  } else {
    completedLessons.add(currentLessonIndex);
  }
  markDoneBtn.classList.toggle('done');
  markDoneBtn.textContent = completedLessons.has(currentLessonIndex) ? '✓ Aula concluída' : 'Marcar aula como concluída';
  renderPath();
});

prevBtn.addEventListener('click', () => {
  if (currentLessonIndex > 0) { currentLessonIndex -= 1; loadLesson(); }
});
nextBtn.addEventListener('click', () => {
  if (currentLessonIndex < lessons.length - 1) { currentLessonIndex += 1; loadLesson(); }
});

function openSidebar() { sidebar.classList.add('open'); sidebarOverlay.classList.add('show'); }
function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('show'); }
mobileToggle.addEventListener('click', openSidebar);
sidebarOverlay.addEventListener('click', closeSidebar);

loadLesson();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
